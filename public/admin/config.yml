backend:
  name: github
  repo: "jlosanimalrescue/jlos-animal-rescue-site"
  branch: main

local_backend: true

media_folder: "public/images/dogs"
public_folder: "/images/dogs"

collections:
  - name: "dogs"
    label: "Dogs"
    label_singular: "Dog"
    folder: "src/data/dogs"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"

    fields:
      - label: "Dog's Name"
        name: "name"
        widget: "string"

      - label: "URL Name"
        name: "slug"
        widget: "string"
        hint: "Lowercase with dashes. Example: sweet-caroline"

      - label: "Breed"
        name: "breed"
        widget: "string"

      - label: "Age"
        name: "age"
        widget: "string"
        hint: "Example: 2 years or 8 months"

      - label: "Sex"
        name: "sex"
        widget: "select"
        options:
          - "Female"
          - "Male"

      - label: "Size"
        name: "size"
        widget: "select"
        options:
          - "Small"
          - "Medium"
          - "Large"
          - "Extra Large"

      - label: "Adoption Status"
        name: "status"
        widget: "select"
        default: "Available"
        options:
          - "Available"
          - "Pending"
          - "Adopted"

      - label: "Feature on Homepage"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Turn this on to show this dog in the featured section on the homepage."

      - label: "Dog Photo"
        name: "image"
        widget: "image"
        required: true
        hint: "Upload the main photo you want visitors to see."

      - label: "About This Dog"
        name: "description"
        widget: "text"
        hint: "Tell potential adopters about this dog's personality, story, and ideal home."