backend:
  name: github
  repo: "jlosanimalrescue/jlos-animal-rescue-site"
  branch: main

local_backend: true

media_folder: "public/images/dogs"
public_folder: "/images/dogs"

collections:
  - name: "dogs"
    label: "Dogs"
    label_singular: "Dog"
    folder: "src/data/dogs"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"

    fields:
      - label: "Dog's Name"
        name: "name"
        widget: "string"

      - label: "URL Name"
        name: "slug"
        widget: "string"
        hint: "Lowercase with dashes. Example: sweet-caroline"

      - label: "Breed"
        name: "breed"
        widget: "string"

      - label: "Age"
        name: "age"
        widget: "string"
        hint: "Example: 2 years or 8 months"

      - label: "Sex"
        name: "sex"
        widget: "select"
        options:
          - "Female"
          - "Male"

      - label: "Size"
        name: "size"
        widget: "select"
        options:
          - "Small"
          - "Medium"
          - "Large"
          - "Extra Large"

      - label: "Adoption Status"
        name: "status"
        widget: "select"
        default: "Available"
        options:
          - "Available"
          - "Pending"
          - "Adopted"

      - label: "Feature on Homepage"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Turn this on to show this dog in the featured section on the homepage."

      - label: "Dog Photo"
        name: "image"
        widget: "image"
        required: true
        hint: "Upload the main photo you want visitors to see."

      - label: "About This Dog"
        name: "description"
        widget: "text"
        hint: "Tell potential adopters about this dog's personality, story, and ideal home."

  - name: "site_settings"
    label: "Site Settings"

    files:
      - label: "Homepage"
        name: "homepage"
        file: "src/data/homepage.json"
        format: "json"

        fields:
          - label: "Campaign Section 1"
            name: "campaign1"
            widget: "object"
            collapsed: true

            fields:
              - label: "Show This Section"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Embed URL"
                name: "embedUrl"
                widget: "string"
                required: false
                hint: "Optional. Use this for a Givebutter or other embeddable campaign."

              - label: "Button Text"
                name: "buttonText"
                widget: "string"
                required: false

              - label: "Button Link"
                name: "buttonLink"
                widget: "string"
                required: false

          - label: "Campaign Section 2"
            name: "campaign2"
            widget: "object"
            collapsed: true

            fields:
              - label: "Show This Section"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Embed URL"
                name: "embedUrl"
                widget: "string"
                required: false
                hint: "Optional. Use this for a Givebutter or other embeddable campaign."

              - label: "Button Text"
                name: "buttonText"
                widget: "string"
                required: false

              - label: "Button Link"
                name: "buttonLink"
                widget: "string"
                required: false