backend:
  name: github
  repo: "jlosanimalrescue/jlos-animal-rescue-site"
  branch: main

local_backend: true

media_folder: "public/images/dogs"
public_folder: "/images/dogs"

collections:
  - name: "dogs"
    label: "Dogs"
    label_singular: "Dog"
    folder: "src/data/dogs"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"

    fields:
      - label: "Dog's Name"
        name: "name"
        widget: "string"

      - label: "URL Name"
        name: "slug"
        widget: "string"
        hint: "Lowercase with dashes. Example: sweet-caroline"

      - label: "Breed"
        name: "breed"
        widget: "string"

      - label: "Age"
        name: "age"
        widget: "string"
        hint: "Example: 2 years or 8 months"

      - label: "Sex"
        name: "sex"
        widget: "select"
        options:
          - "Female"
          - "Male"

      - label: "Size"
        name: "size"
        widget: "select"
        options:
          - "Small"
          - "Medium"
          - "Large"
          - "Extra Large"

      - label: "Adoption Status"
        name: "status"
        widget: "select"
        default: "Available"
        options:
          - "Available"
          - "Pending"
          - "Adopted"

      - label: "Feature on Homepage"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Turn this on to show this dog in the featured section on the homepage."

      - label: "Dog Photo"
        name: "image"
        widget: "image"
        required: true
        hint: "Upload the main photo you want visitors to see."

      - label: "About This Dog"
        name: "description"
        widget: "text"
        hint: "Tell potential adopters about this dog's personality, story, and ideal home."

  - name: "site_settings"
    label: "Site Settings"

    files:
      - label: "Homepage"
        name: "homepage"
        file: "src/data/homepage.json"
        format: "json"

        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true

            fields:
              - label: "Headline Line 1"
                name: "headlineLine1"
                widget: "string"

              - label: "Headline Line 2"
                name: "headlineLine2"
                widget: "string"

              - label: "Headline Line 3"
                name: "headlineLine3"
                widget: "string"

              - label: "Headline Line 4"
                name: "headlineLine4"
                widget: "string"

              - label: "Subheadline Line 1"
                name: "subheadlineLine1"
                widget: "string"

              - label: "Subheadline Line 2"
                name: "subheadlineLine2"
                widget: "string"

              - label: "Primary Button Text"
                name: "primaryButtonText"
                widget: "string"

              - label: "Primary Button Link"
                name: "primaryButtonLink"
                widget: "string"

              - label: "Donate Button Text"
                name: "donateButtonText"
                widget: "string"

              - label: "Donate Button Link"
                name: "donateButtonLink"
                widget: "string"

          - label: "Featured Dogs Section"
            name: "featuredDogs"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

          - label: "Mission Section"
            name: "mission"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Paragraph 1"
                name: "paragraph1"
                widget: "text"

              - label: "Paragraph 2"
                name: "paragraph2"
                widget: "text"

              - label: "Paragraph 3"
                name: "paragraph3"
                widget: "text"

          - label: "Get Involved Section"
            name: "involved"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Adopt Card Title"
                name: "adoptTitle"
                widget: "string"

              - label: "Adopt Card Description"
                name: "adoptDescription"
                widget: "text"

              - label: "Donate Card Title"
                name: "donateTitle"
                widget: "string"

              - label: "Donate Card Description"
                name: "donateDescription"
                widget: "text"

              - label: "Volunteer Card Title"
                name: "volunteerTitle"
                widget: "string"

              - label: "Volunteer Card Description"
                name: "volunteerDescription"
                widget: "text"

          - label: "Donation Section"
            name: "donation"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Button Text"
                name: "buttonText"
                widget: "string"

              - label: "Button Link"
                name: "buttonLink"
                widget: "string"

          - label: "FAQs"
            name: "faqs"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Question 1"
                name: "question1"
                widget: "string"

              - label: "Answer 1"
                name: "answer1"
                widget: "text"

              - label: "Question 2"
                name: "question2"
                widget: "string"

              - label: "Answer 2"
                name: "answer2"
                widget: "text"

              - label: "Question 3"
                name: "question3"
                widget: "string"

              - label: "Answer 3"
                name: "answer3"
                widget: "text"

          - label: "Contact Section"
            name: "contact"
            widget: "object"
            collapsed: true

            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Name Placeholder"
                name: "namePlaceholder"
                widget: "string"

              - label: "Email Placeholder"
                name: "emailPlaceholder"
                widget: "string"

              - label: "Dog Placeholder"
                name: "dogPlaceholder"
                widget: "string"

              - label: "Message Placeholder"
                name: "messagePlaceholder"
                widget: "string"

              - label: "Button Text"
                name: "buttonText"
                widget: "string"

          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true

            fields:
              - label: "Location"
                name: "location"
                widget: "string"

              - label: "Tagline"
                name: "tagline"
                widget: "string"

              - label: "Meet the Dogs Link Text"
                name: "dogsLinkText"
                widget: "string"

              - label: "Mission Link Text"
                name: "missionLinkText"
                widget: "string"

              - label: "Get Involved Link Text"
                name: "involvedLinkText"
                widget: "string"

              - label: "Contact Link Text"
                name: "contactLinkText"
                widget: "string"

          - label: "Campaign Section 1"
            name: "campaign1"
            widget: "object"
            collapsed: true

            fields:
              - label: "Show This Section"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Embed URL"
                name: "embedUrl"
                widget: "string"
                required: false
                hint: "Optional. Use this for a Givebutter or other embeddable campaign."

              - label: "Button Text"
                name: "buttonText"
                widget: "string"
                required: false

              - label: "Button Link"
                name: "buttonLink"
                widget: "string"
                required: false

          - label: "Campaign Section 2"
            name: "campaign2"
            widget: "object"
            collapsed: true

            fields:
              - label: "Show This Section"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Embed URL"
                name: "embedUrl"
                widget: "string"
                required: false
                hint: "Optional. Use this for a Givebutter or other embeddable campaign."

              - label: "Button Text"
                name: "buttonText"
                widget: "string"
                required: false

              - label: "Button Link"
                name: "buttonLink"
                widget: "string"
                required: false

      - label: "Adopt Page"
        name: "adopt"
        file: "src/data/adopt.json"
        format: "json"

        fields:
          - label: "Hero Eyebrow"
            name: "heroEyebrow"
            widget: "string"

          - label: "Hero Title"
            name: "heroTitle"
            widget: "string"

          - label: "Hero Description"
            name: "heroDescription"
            widget: "text"

          - label: "Dog Count Text"
            name: "dogCountText"
            widget: "string"

          - label: "Photo Coming Soon Text"
            name: "photoComingSoon"
            widget: "string"

          - label: "Adopted Overlay Text"
            name: "adoptedOverlay"
            widget: "string"

          - label: "Adopted Message"
            name: "adoptedMessage"
            widget: "string"

          - label: "Meet Dog Button Text"
            name: "meetDogText"
            widget: "string"

          - label: "Footer Location"
            name: "footerLocation"
            widget: "string"

          - label: "Footer Tagline"
